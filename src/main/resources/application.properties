spring.application.name=ecorota-api
server.port=${PORT:8080}

# Conexão com o MySQL (cria o banco 'ecorota' sozinho se ainda não existir)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecorota?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.error.include-message=always