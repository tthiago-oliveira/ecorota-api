spring.application.name=ecorota-api

# Conexão com o MySQL (cria o banco 'ecorota' sozinho se ainda não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/ecorota?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Deixe 'none' só agora enquanto a pasta model ainda está vazia
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.error.include-message=always